# Conda environment — Science Nationalism Research Repository
#
#   conda env create -f environment.yml
#   conda activate science-nationalism
#
# Preferred over `pip install -r requirements.txt` because geopandas and
# cartopy depend on compiled GEOS/PROJ/GDAL libraries that conda-forge
# ships as prebuilt binaries.

name: science-nationalism

channels:
  - conda-forge

dependencies:
  - python=3.9

  # Core data handling
  - pandas=2.3.3
  - numpy=1.25.2
  - pyarrow=21.0.0
  - openpyxl=3.1.2
  - xlrd=2.0.1
  - duckdb=1.4.5
  - pyreadstat=1.3.1

  # Statistics / econometrics
  - statsmodels=0.14.6
  - scipy=1.11.3
  - scikit-learn=1.6.1

  # Networks
  - networkx=3.2.1

  # Geospatial
  - geopandas=1.0.1
  - shapely=2.0.7
  - fiona=1.10.1
  - cartopy=0.23.0
  - pycountry=24.6.1

  # Plotting
  - matplotlib=3.9.4
  - seaborn=0.13.2

  # Workflow orchestration
  - snakemake-minimal=7.32.4

  # Interactive use
  - jupyterlab

  - pip
  - pip:
      - adjustText==1.4.0
